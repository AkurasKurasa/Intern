# Deploy treetask/ to GitHub Pages on every push — the tree stays live for the
# whole group; crossing something off = editing treetask/tasks.js (GitHub web
# editor works) → commit → this workflow redeploys → everyone sees it.
name: Deploy TreeTask to Pages

on:
  push:
    branches: [master, nav-protocol-scroll-submit]
    paths: [treetask/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: treetask
      - id: deployment
        uses: actions/deploy-pages@v4
