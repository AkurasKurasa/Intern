<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Intern</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="titlebar" id="titlebar">Intern</div>

  <!-- ── Landing / splash screen ─────────────────────────────────────── -->
  <div id="splash" class="splash">
    <div class="splash-mark">
      <span class="splash-ring"></span>
      <span class="splash-i">I</span>
    </div>
    <h1 class="splash-title">Intern</h1>
    <p class="splash-tag">Learning your workflow, one demonstration at a time.</p>
    <div class="splash-bar"><i id="splashBarFill"></i></div>
    <p class="splash-status" id="splashStatus">Starting up…</p>
  </div>

  <!-- ── Main shell: icon rail | main area | recorder panel ───────────── -->
  <div id="shell" class="shell">
    <nav class="sidebar" aria-label="Primary">
      <div class="side-mark" title="Intern">I</div>
      <button class="side-btn active" id="navRecorder" type="button" title="Home" aria-label="Home" aria-current="page">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="8.4"/>
          <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button class="side-btn" id="navWorkflows" type="button" title="Workflows" aria-label="Workflows">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="5" cy="6" r="2.4"/>
          <circle cx="5" cy="18" r="2.4"/>
          <circle cx="18" cy="12" r="2.4"/>
          <path d="M7.1 6.9 L15.8 11"/>
          <path d="M7.1 17.1 L15.8 13"/>
        </svg>
      </button>
      <div class="side-status" id="sideStatus" title="Backend disconnected">
        <i class="dot" id="sideStatusDot"></i>
      </div>
    </nav>

    <!-- Middle — TBD, placeholder for now -->
    <main class="main-area" id="mainArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark">I</div>
        <p class="empty-text">Nothing selected yet</p>
      </div>

      <div class="mid-panel" id="workflowsWrap" hidden>
        <header class="mid-head">
          <div>
            <h2>Workflows</h2>
            <p class="hint">Recorded demonstration sessions on disk, grouped by task</p>
          </div>
          <button class="btn btn-ghost btn-sm" id="btnRefreshWorkflows" type="button">⟳ Refresh</button>
        </header>
        <div class="mid-body">
          <div id="workflowsList" class="workflows-list">
            <p class="muted">Loading…</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Right — small, always-visible recorder utility panel -->
    <aside class="recorder-panel" aria-label="Demo Recorder">
      <header class="rp-head">
        <h2>Recorder</h2>
        <div class="clock" id="clock"></div>
      </header>

      <div class="rp-status" id="statusBar">
        <i class="dot" id="statusDot"></i>
        <span id="statStatus">Idle</span>
      </div>

      <div class="rp-stats">
        <span id="statFrames">0</span><span class="rp-stats-label">frames</span>
        <span class="rp-sep">·</span>
        <span id="statSessions">0</span><span class="rp-stats-label">sessions</span>
      </div>

      <label class="field-label" for="outDir">Save to</label>
      <input class="field" id="outDir" type="text" value="data/demos/eight_Tabs" />

      <div class="rp-btn-row">
        <button class="btn btn-primary" id="btnStart">● Start</button>
        <button class="btn btn-danger" id="btnStop" disabled>■ Stop</button>
      </div>

      <h3 class="rp-log-head">Activity</h3>
      <div class="log" id="log"></div>
    </aside>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
