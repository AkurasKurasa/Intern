<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Intern — mini</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: var(--font-ui);
  }

  /* column-reverse so the FIRST child (the handle) sits at the bottom,
     with Stop/Play revealing upward above it -- matches how a real
     floating-action-button stack reads (anchor at the corner, options
     fan out from it), and means the window can be anchored bottom-right
     without any of the JS caring about layout direction. */
  .stack {
    display: flex; flex-direction: column-reverse;
    align-items: center; justify-content: flex-end;
    gap: 12px;
    width: 100%; height: 100%;
    padding: 12px 0;
    -webkit-app-region: no-drag;
  }

  .circle {
    width: 52px; height: 52px; min-height: 52px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.30);
    transition: transform .12s ease, opacity .15s ease, background .12s ease;
  }
  .circle svg { width: 18px; height: 18px; }
  .circle:active:not(:disabled) { transform: scale(0.90); }
  .circle:disabled { opacity: .35; cursor: not-allowed; }

  .handle {
    background: var(--ink); color: white;
    font-family: var(--font-mono); font-weight: 700; font-size: 15px;
  }
  .handle:hover { background: #2A2820; }
  /* The one indicator visible while the agent is actually running, since
     the widget is collapsed down to a single circle with no room for a
     status label. Deliberately no step-count text on the handle -- there
     is no known total step count ahead of a run (see renderer.js), so a
     fake "3/6" would misrepresent real progress; the pulse alone is the
     honest signal. */
  .handle.running { animation: pulse var(--motion-pulse) ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 3px 10px rgba(0,0,0,.30), 0 0 0 0 rgba(180,68,30,.55); }
    50%      { box-shadow: 0 3px 10px rgba(0,0,0,.30), 0 0 0 9px rgba(180,68,30,0); }
  }

  /* Collapsed by default: Play/Stop are present in the DOM (so they can
     still receive their disabled state updates while hidden) but scaled
     to nothing and non-interactive. Expanding is purely a class toggle
     on the container, animated via transform/opacity on each circle. */
  .action {
    opacity: 0; transform: scale(0.4);
    pointer-events: none;
  }
  .stack.expanded .action {
    opacity: 1; transform: scale(1);
    pointer-events: auto;
  }

  /* White circles rising above the handle, per the design direction --
     the icon colour (ink/clay) carries the meaning instead of the fill. */
  .action-play { background: white; color: var(--ink); }
  .action-play:hover:not(:disabled) { background: var(--sunk); }
  .action-stop { background: white; color: var(--clay); }
  .action-stop:hover:not(:disabled) { background: var(--clay-tint-bg); }

  @media (prefers-reduced-motion: reduce) {
    .handle.running { animation: none; }
  }
</style>
</head>
<body>
  <div class="stack" id="stack">
    <button class="circle handle" id="btnHandle" type="button"
            title="Play / Stop" aria-label="Expand play controls" aria-expanded="false">I</button>
    <button class="circle action action-stop" id="btnStop" type="button"
            disabled title="Stop" aria-label="Stop the running capsule">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
    </button>
    <button class="circle action action-play" id="btnPlay" type="button"
            disabled title="Play" aria-label="Play the loaded capsule">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>
    </button>
  </div>
  <script src="mini-workflow.js"></script>
</body>
</html>
