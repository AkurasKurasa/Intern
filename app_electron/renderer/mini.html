<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Intern — mini</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  /* Redesign, direct request (uiux_record_overlay_redesign): "turn it
     into a circle and expandable to either Record or Stop... add some
     information there... black transparent bg and white text... the
     information being 'x frames / x session'." Rebuilt on the exact
     proven pattern from the Workflows-tab sibling (mini-workflow.html) --
     same transparent floating-action-button shape, same collapse
     mechanics, same real specificity-safe CSS (that widget's ghost-
     outline bug fixed first, so it's never repeated here) -- rather than
     a second, slightly-different implementation of the same idea. Picked
     the black-transparent-pill + white-text option over plain floating
     text: a pill with its own background stays legible over any desktop
     wallpaper, floating text alone would not. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: var(--font-ui);
  }

  .stack {
    display: flex; flex-direction: column-reverse;
    align-items: center; justify-content: flex-end;
    gap: 12px;
    width: 100%; height: 100%;
    padding: 12px 0;
    -webkit-app-region: no-drag;
  }

  .circle {
    width: 52px; height: 52px; min-height: 52px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.30);
    transition: transform .12s ease, opacity .15s ease, background .12s ease;
    flex: none;
  }
  .circle svg { width: 18px; height: 18px; }
  .circle:active:not(:disabled) { transform: scale(0.90); }
  .circle:disabled { opacity: .35; cursor: not-allowed; }

  .handle {
    background: var(--ink); color: white;
    font-family: var(--font-mono); font-weight: 700; font-size: 15px;
  }
  .handle:hover { background: #2A2820; }
  /* Same signal as the main window's recorder dot (mini-status .dot):
     clay while capturing a take, since that take is what will later
     drive the agent -- an existing, deliberate precedent in this exact
     file, not a new use of the reserved colour. */
  .handle.recording { animation: pulse var(--motion-pulse) ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 3px 10px rgba(0,0,0,.30), 0 0 0 0 rgba(180,68,30,.55); }
    50%      { box-shadow: 0 3px 10px rgba(0,0,0,.30), 0 0 0 9px rgba(180,68,30,0); }
  }

  /* Collapsed by default -- matching mini-workflow.html's already-fixed
     pattern exactly: real compound class list (circle + action +
     action-record/-stop) so the "stay hidden" rule wins on specificity
     outright, never a source-order coincidence. See that file's own
     comment for the live-confirmed bug this avoids repeating. */
  .circle.action.action-record,
  .circle.action.action-stop,
  .circle.action.action-switch {
    opacity: 0; transform: scale(0.4);
    pointer-events: none;
  }
  .stack.expanded .circle.action.action-record,
  .stack.expanded .circle.action.action-stop,
  .stack.expanded .circle.action.action-switch {
    opacity: 1; transform: scale(1);
    pointer-events: auto;
  }
  .stack.expanded .circle.action.action-record:disabled,
  .stack.expanded .circle.action.action-stop:disabled {
    opacity: .35;
  }

  .action-record { background: white; color: var(--ink); }
  .action-record:hover:not(:disabled) { background: var(--sunk); }
  .action-stop { background: white; color: var(--clay); }
  .action-stop:hover:not(:disabled) { background: var(--clay-tint-bg); }
  /* Switch-to-other-widget -- direct request: "Find a way to navigate
     between the two widgets (Record and Workflow)." Same neutral
     treatment as the Workflows-tab sibling's own switch button. */
  .action-switch { background: white; color: var(--ink); }
  .action-switch:hover { background: var(--sunk); }

  /* Model info -- direct request: "x frames / x session", black
     transparent background, white text. Two explicit lines rather than
     one truncated line (mini-workflow.html's single-line pill is fine
     for a name that's OK to truncate; frame/session counts are the
     whole point of this pill and must never get cut off). Only shown
     expanded, matching the sibling widget's own "collapsed stays
     minimal" decision. */
  .info-pill {
    opacity: 0; transform: scale(0.4); pointer-events: none;
    transition: transform .12s ease, opacity .15s ease;
    flex: none;
    width: 92px; padding: 6px 8px; border-radius: 12px;
    background: rgba(20,19,15,.72); color: white;
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    line-height: 1.4; text-align: center;
  }
  .stack.expanded .info-pill {
    opacity: 1; transform: scale(1);
  }

  @media (prefers-reduced-motion: reduce) {
    .handle.recording { animation: none; }
  }
</style>
</head>
<body>
  <div class="stack" id="stack">
    <button class="circle handle" id="btnHandle" type="button"
            title="Record / Stop" aria-label="Expand record controls" aria-expanded="false">I</button>
    <button class="circle action action-switch" id="btnSwitchWidget" type="button"
            title="Switch to Workflows" aria-label="Switch to the Workflows widget">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13M13 8l-3-3M13 8l-3 3M20 16H7M7 16l3-3M7 16l3 3"/></svg>
    </button>
    <button class="circle action action-stop" id="btnStop" type="button"
            disabled title="Stop" aria-label="Stop recording">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
    </button>
    <button class="circle action action-record" id="btnStart" type="button"
            title="Record" aria-label="Start recording">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg>
    </button>
    <div class="info-pill" id="infoPill" aria-live="polite">
      <div id="infoFrames">0 frames</div>
      <div id="infoSessions">0 sessions</div>
    </div>
  </div>
  <script src="mini.js"></script>
</body>
</html>
