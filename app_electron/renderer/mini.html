<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Intern — mini</title>
<style>
  :root {
    --orange: #F97316;
    --white: #FFFFFF;
    --page-bg: #F6F6F4;
    --border-strong: #E2E2E2;
    --ink: #1C1917;
    --dim: #8A8580;
    --green: #16A34A;
    --red: #DC2626;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--page-bg);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    overflow: hidden;
    font-family: "Segoe UI", -apple-system, sans-serif;
    color: var(--ink);
  }
  .mini {
    display: flex; flex-direction: column;
    height: 100%; padding: 10px 12px;
    gap: 8px;
  }
  .mini-head {
    display: flex; align-items: center; justify-content: space-between;
    -webkit-app-region: drag;
    cursor: default;
  }
  .mini-head .brand {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700;
  }
  .mini-mark {
    width: 16px; height: 16px; border-radius: 5px;
    background: var(--white); color: var(--orange);
    border: 1.2px solid var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 10px;
  }
  .restore-btn {
    -webkit-app-region: no-drag;
    width: 20px; height: 20px; border-radius: 6px;
    border: none; background: transparent; color: var(--dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .restore-btn:hover { background: var(--white); color: var(--ink); }

  .mini-status {
    display: flex; align-items: center; gap: 7px;
    background: var(--white); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 6px 10px;
    font-size: 12px; font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.recording { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.error { background: var(--red); }

  .mini-frames { font-size: 11px; color: var(--dim); font-family: Consolas, monospace; }
  .mini-frames b { color: var(--ink); }

  .mini-btn-row { display: flex; gap: 8px; margin-top: auto; }
  .btn {
    flex: 1; border: 1px solid transparent; border-radius: 8px;
    padding: 7px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--orange); color: white; }
  .btn-danger { background: var(--white); color: var(--red); border-color: var(--red); }
</style>
</head>
<body>
  <div class="mini">
    <div class="mini-head">
      <div class="brand"><span class="mini-mark">I</span>Intern</div>
      <button class="restore-btn" id="btnRestore" title="Restore window" aria-label="Restore window">▢</button>
    </div>

    <div class="mini-status">
      <i class="dot" id="statusDot"></i>
      <span id="statStatus">Idle</span>
    </div>

    <div class="mini-frames"><b id="statFrames">0</b> frames</div>

    <div class="mini-btn-row">
      <button class="btn btn-primary" id="btnStart">● Start</button>
      <button class="btn btn-danger" id="btnStop" disabled>■ Stop</button>
    </div>
  </div>

  <script src="mini.js"></script>
</body>
</html>
