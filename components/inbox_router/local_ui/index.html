<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inbox Dispatch</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="gmail-shell">
    <header class="topbar">
      <button class="icon-btn" aria-hidden="true" tabindex="-1" title="Menu">&#9776;</button>
      <div class="logo">
        <span class="logo-mark">&#128235;</span>
        <span class="logo-text">Inbox Dispatch</span>
      </div>
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">&#128269;</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search mail">
        <span class="search-filter-icon" aria-hidden="true" title="Search options">&#9881;</span>
      </div>
      <div class="topbar-icons">
        <button class="icon-btn" aria-hidden="true" tabindex="-1" title="Support">?</button>
        <button class="icon-btn" aria-hidden="true" tabindex="-1" title="Settings">&#9881;</button>
        <button class="icon-btn icon-btn-apps" aria-hidden="true" tabindex="-1" title="Google apps">&#9642;&#9642;&#9642;<br>&#9642;&#9642;&#9642;<br>&#9642;&#9642;&#9642;</button>
        <div class="avatar topbar-avatar" aria-hidden="true">?</div>
      </div>
    </header>

    <div class="body-row">
      <nav class="sidebar">
        <button id="refreshBtn" class="compose-btn">
          <span class="compose-icon">&#8635;</span> Refresh
        </button>
        <div class="nav-item nav-item-active">
          <span class="nav-icon" aria-hidden="true">&#128229;</span>
          <span class="nav-label">Inbox</span>
          <span class="nav-count" id="inboxCount"></span>
        </div>
        <div class="nav-item nav-item-muted" aria-hidden="true">
          <span class="nav-icon">&#9733;</span>
          <span class="nav-label">Starred</span>
        </div>
        <div class="nav-item nav-item-muted" aria-hidden="true">
          <span class="nav-icon">&#128340;</span>
          <span class="nav-label">Snoozed</span>
        </div>
        <div class="nav-item nav-item-muted" aria-hidden="true">
          <span class="nav-icon">&#10148;</span>
          <span class="nav-label">Sent</span>
        </div>
        <div class="nav-item nav-item-muted" aria-hidden="true">
          <span class="nav-icon">&#128221;</span>
          <span class="nav-label">Drafts</span>
        </div>
        <div class="nav-item nav-item-muted nav-item-more" aria-hidden="true">
          <span class="nav-icon">&#9662;</span>
          <span class="nav-label">More</span>
        </div>
      </nav>

      <main class="main-pane">
        <div id="listView">
          <div class="list-toolbar">
            <span class="toolbar-checkbox" aria-hidden="true"></span>
            <button id="toolbarRefreshBtn" class="toolbar-icon-btn" title="Refresh">&#8635;</button>
            <button class="toolbar-icon-btn" aria-hidden="true" tabindex="-1" title="More">&#8942;</button>
            <span class="toolbar-count" id="toolbarCount"></span>
          </div>
          <p id="emptyState" class="empty-state" hidden>No pending emails. Click Refresh to check again.</p>
          <ul id="rowList" class="row-list"></ul>
        </div>

        <div id="detailView" class="detail-view" hidden>
          <div class="detail-toolbar">
            <button id="backBtn" class="toolbar-icon-btn" title="Back to Inbox">&#8592;</button>
            <button class="toolbar-icon-btn" aria-hidden="true" tabindex="-1" title="Archive">&#128230;</button>
            <button class="toolbar-icon-btn" aria-hidden="true" tabindex="-1" title="Delete">&#128465;</button>
            <button class="toolbar-icon-btn" aria-hidden="true" tabindex="-1" title="Mark as unread">&#9993;</button>
            <button class="toolbar-icon-btn" aria-hidden="true" tabindex="-1" title="Snooze">&#128340;</button>
          </div>
          <h1 class="detail-subject" id="detailSubject"></h1>
          <div class="detail-header">
            <div class="avatar" id="detailAvatar"></div>
            <div class="detail-header-text">
              <div class="detail-sender-row">
                <span class="detail-sender" id="detailSender"></span>
                <span class="detail-tome">to me</span>
                <span class="detail-chevron" aria-hidden="true">&#9662;</span>
              </div>
              <div class="detail-rationale" id="detailRationale"></div>
            </div>
            <div class="detail-header-actions" aria-hidden="true">
              <button class="toolbar-icon-btn" tabindex="-1" title="Reply">&#8617;</button>
              <button class="toolbar-icon-btn" tabindex="-1" title="More">&#8942;</button>
            </div>
          </div>
          <pre class="detail-body" id="detailBody"></pre>

          <div class="reply-bar">
            <div class="decision-bar">
              <span class="decision-label">Suggested: <strong id="detailDecision"></strong></span>
              <button id="confirmBtn" class="btn btn-primary">&check; Confirm</button>
            </div>
            <div class="override-bar">
              <select id="overrideSelect">
                <option value="route_scope1">Route to Scope #1</option>
                <option value="route_scope2">Route to Scope #2</option>
                <option value="reply">Reply</option>
                <option value="forward">Forward</option>
                <option value="flag">Flag</option>
                <option value="leave_alone">Leave alone</option>
              </select>
              <button id="overrideBtn" class="btn btn-ghost">Override</button>
            </div>
          </div>
          <p id="detailStatus" class="status-line"></p>
        </div>
      </main>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
