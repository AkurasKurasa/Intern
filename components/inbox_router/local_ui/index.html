<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inbox Dispatch</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="gmail-shell">
    <header class="topbar">
      <button class="icon-btn" aria-hidden="true" tabindex="-1">&#9776;</button>
      <div class="logo">
        <span class="logo-mark">&#128235;</span>
        <span class="logo-text">Inbox Dispatch</span>
      </div>
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">&#128269;</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search mail">
      </div>
      <div class="avatar topbar-avatar" aria-hidden="true">?</div>
    </header>

    <div class="body-row">
      <nav class="sidebar">
        <button id="refreshBtn" class="compose-btn">
          <span class="compose-icon">&#8635;</span> Refresh
        </button>
        <div class="nav-item nav-item-active">
          <span class="nav-icon" aria-hidden="true">&#128229;</span>
          <span class="nav-label">Inbox</span>
          <span class="nav-count" id="inboxCount"></span>
        </div>
      </nav>

      <main class="main-pane">
        <div id="listView">
          <p id="emptyState" class="empty-state" hidden>No pending emails. Click Refresh to check again.</p>
          <ul id="rowList" class="row-list"></ul>
        </div>

        <div id="detailView" class="detail-view" hidden>
          <button id="backBtn" class="btn-back">&larr; Back to Inbox</button>
          <h1 class="detail-subject" id="detailSubject"></h1>
          <div class="detail-header">
            <div class="avatar" id="detailAvatar"></div>
            <div class="detail-header-text">
              <div class="detail-sender" id="detailSender"></div>
              <div class="detail-rationale" id="detailRationale"></div>
            </div>
          </div>
          <pre class="detail-body" id="detailBody"></pre>

          <div class="reply-bar">
            <div class="decision-bar">
              <span class="decision-label">Suggested: <strong id="detailDecision"></strong></span>
              <button id="confirmBtn" class="btn btn-primary">&check; Confirm</button>
            </div>
            <div class="override-bar">
              <select id="overrideSelect">
                <option value="route_scope1">Route to Scope #1</option>
                <option value="route_scope2">Route to Scope #2</option>
                <option value="reply">Reply</option>
                <option value="forward">Forward</option>
                <option value="flag">Flag</option>
                <option value="leave_alone">Leave alone</option>
              </select>
              <button id="overrideBtn" class="btn btn-ghost">Override</button>
            </div>
          </div>
          <p id="detailStatus" class="status-line"></p>
        </div>
      </main>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
